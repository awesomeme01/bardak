# Продакшн-связка: база, приложение, Caddy с автосертификатом.
#
# ⭐ Три контейнера и ни одного лишнего (ADR-061). Redis, второй инстанс и sticky routing
# отменены решением: присутствие живёт в памяти узла, и для игры на вечер этого достаточно.
#
# Запуск:  docker compose -f deploy/compose.prod.yaml --env-file deploy/.env up -d
# Откат:   deploy/rollback.sh

name: bardak

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bardak
      POSTGRES_USER: bardak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?пароль базы обязателен}
      # Локаль зафиксирована: сортировка влияет на индексы, менять её потом больно.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bardak -d bardak"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ⚠️ Порт НЕ проброшен наружу: база доступна только из сети compose. На VPS
    # проброшенный 5432 — это открытая дверь, которую никто не собирался открывать.

  app:
    image: bardak:${BARDAK_VERSION:-latest}
    build:
      context: ..
      dockerfile: back-go/Dockerfile
      args:
        VERSION: ${BARDAK_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BARDAK_ENV: prod
      BARDAK_DB_URL: postgres://bardak:${POSTGRES_PASSWORD}@postgres:5432/bardak?sslmode=disable
      # ⚠️ Без этих двух сервер откажется стартовать — и правильно сделает:
      # умолчания лежат в открытом репозитории.
      BARDAK_JWT_SECRET: ${BARDAK_JWT_SECRET:?секрет JWT обязателен в проде}
      BARDAK_INVITE_CODES: ${BARDAK_INVITE_CODES:?код приглашения обязателен в проде}
      BARDAK_SEASON_ADMINS: ${BARDAK_SEASON_ADMINS:-}
      # Уведомления «твой ход»: без ключей просто выключены.
      BARDAK_VAPID_PUBLIC: ${BARDAK_VAPID_PUBLIC:-}
      BARDAK_VAPID_PRIVATE: ${BARDAK_VAPID_PRIVATE:-}
      BARDAK_VAPID_SUBJECT: ${BARDAK_VAPID_SUBJECT:-mailto:admin@${BARDAK_DOMAIN}}
      # ⭐ Origin сокета — ровно домен и ничего больше: за Caddy запросы приходят с него.
      BARDAK_WS_ORIGINS: https://${BARDAK_DOMAIN:?домен обязателен}
      BARDAK_WS_ORIGIN_PATTERNS: ""
      BARDAK_AUTO_MOVE: ${BARDAK_AUTO_MOVE:-false}
      BARDAK_LOG_FORMAT: json
    # ⚠️ Порт наружу тоже не проброшен: снаружи в приложение ходят ТОЛЬКО через Caddy,
    # иначе HTTPS обходится по http://<ip>:8088.
    expose:
      - "8088"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      BARDAK_DOMAIN: ${BARDAK_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  caddy-data:
  caddy-config:
