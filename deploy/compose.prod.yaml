# Продакшн-связка: база, приложение, Caddy с автосертификатом.
#
# ⭐ Три контейнера и ни одного лишнего (ADR-061). Redis, второй инстанс и sticky routing
# отменены решением: присутствие живёт в памяти узла, и для игры на вечер этого достаточно.
#
# Запуск:  docker compose -f deploy/compose.prod.yaml --env-file deploy/.env up -d
# Откат:   deploy/rollback.sh

name: bardak

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bardak
      POSTGRES_USER: bardak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?пароль базы обязателен}
      # Локаль зафиксирована: сортировка влияет на индексы, менять её потом больно.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bardak -d bardak"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ⚠️ Порт НЕ проброшен наружу: база доступна только из сети compose. На VPS
    # проброшенный 5432 — это открытая дверь, которую никто не собирался открывать.

  app:
    image: bardak:${BARDAK_VERSION:-latest}
    build:
      context: ..
      dockerfile: back-go/Dockerfile
      args:
        VERSION: ${BARDAK_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BARDAK_ENV: prod
      BARDAK_DB_URL: postgres://bardak:${POSTGRES_PASSWORD}@postgres:5432/bardak?sslmode=disable
      # ⚠️ Без этих двух сервер откажется стартовать — и правильно сделает:
      # умолчания лежат в открытом репозитории.
      BARDAK_JWT_SECRET: ${BARDAK_JWT_SECRET:?секрет JWT обязателен в проде}
      BARDAK_INVITE_CODES: ${BARDAK_INVITE_CODES:?код приглашения обязателен в проде}
      BARDAK_SEASON_ADMINS: ${BARDAK_SEASON_ADMINS:-}
      # Уведомления «твой ход»: без ключей просто выключены.
      BARDAK_VAPID_PUBLIC: ${BARDAK_VAPID_PUBLIC:-}
      BARDAK_VAPID_PRIVATE: ${BARDAK_VAPID_PRIVATE:-}
      BARDAK_VAPID_SUBJECT: ${BARDAK_VAPID_SUBJECT:-mailto:admin@${BARDAK_DOMAIN}}
      # ⭐ Origin сокета — ровно домены игры и ничего больше: за Caddy запросы приходят
      # с них. ⚠️ Список обязан совпадать с доменами Caddy: сокет с чужого Origin
      # отбивается, и «игра открылась, но стол не ходит» — это про рассинхрон здесь.
      BARDAK_WS_ORIGINS: ${BARDAK_WS_ORIGINS:-https://${BARDAK_DOMAIN:?домен обязателен}}
      BARDAK_WS_ORIGIN_PATTERNS: ""
      BARDAK_AUTO_MOVE: ${BARDAK_AUTO_MOVE:-false}
      BARDAK_LOG_FORMAT: json
    # ⚠️ Порт наружу тоже не проброшен: снаружи в приложение ходят ТОЛЬКО через Caddy,
    # иначе HTTPS обходится по http://<ip>:8088.
    expose:
      - "8088"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      BARDAK_DOMAIN: ${BARDAK_DOMAIN}
      # Список доменов для Caddy; не задан — берётся единственный, как было раньше.
      BARDAK_DOMAINS: ${BARDAK_DOMAINS:-${BARDAK_DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Прокси для Telegram (MTProto, fake-TLS). К игре отношения не имеет — просто живёт рядом.
  #
  # ⭐ Профиль `proxy`: обычный `up -d` и tools/ship.sh прокси не трогают. Поднимается
  # отдельно — tools/proxy.sh.
  # ⭐ Секрет выпущен на домен игры: кто постучится на порт без секрета, получит
  # настоящий сертификат от Caddy (domain fronting на 443 того же сервера).
  # ⚠️ IP общий с игрой: заблокируют прокси — вместе с ним отвалится и игра.
  mtproto:
    image: nineseconds/mtg:2.1.7
    profiles: [proxy]
    restart: unless-stopped
    command: ["simple-run", "-i", "prefer-ipv4", "-n", "1.1.1.1", "0.0.0.0:3128", "${MTG_SECRET:-}"]
    ports:
      - "${MTG_PORT:-8443}:3128"

  # VPN «только для Telegram»: в туннель клиента попадают лишь подсети Telegram
  # (deploy/wireguard/telegram-cidr.txt), остальной трафик идёт мимо. Работает и для
  # приложения, и для веб-версии, без настроек внутри Telegram.
  #
  # ⭐ Профиль `vpn`: ship.sh и обычный `up -d` его не трогают. Управление — tools/vpn.sh.
  # ⚠️ Ключи — в томе wg-config, а НЕ в ~/bardak/deploy: ship.sh синхронизирует deploy/
  # с --delete и стёр бы их, как однажды стёр .env.
  # ⚠️ Шаблон клиента без строки DNS: иначе VPN подменил бы DNS всей системы, и на рабочем
  # ноутбуке отвалились бы корпоративные имена. Telegram ходит по IP, DNS ему не нужен.
  # ⭐ IPv6 на сервере нет, но v6-подсети Telegram всё равно в туннеле: сервер их отбрасывает,
  # и клиент откатывается на v4 через VPN, а не уходит по v6 мимо него.
  wireguard:
    image: lscr.io/linuxserver/wireguard:1.0.20250521
    profiles: [vpn]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      TZ: Asia/Almaty
      SERVERURL: ${WG_PUBLIC_HOST:-auto}
      SERVERPORT: ${WG_PORT:-51820}
      PEERS: ${WG_PEERS:-}
      ALLOWEDIPS: ${WG_ALLOWEDIPS:-}
      INTERNAL_SUBNET: 10.13.13.0
      # QR и конфиги в логах — это ключи в логах.
      LOG_CONFS: "false"
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    volumes:
      - wg-config:/config
      - ./wireguard/peer.conf:/config/templates/peer.conf:ro

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  wg-config:
