<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Рубашка карты. В исходном наборе SVG-cards 1.3 её нет, поэтому нарисована здесь.
  viewBox совпадает с картами набора (167.0869141 x 242.6669922), чтобы рубашка
  и лицо карты были одного размера без подгонки на клиенте.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="167.0869141pt" height="242.6669922pt"
     viewBox="0 0 167.0869141 242.6669922"
     version="1.1">
  <defs>
    <pattern id="lattice" width="11.36" height="11.36"
             patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="11.36" height="11.36" fill="#9b2226"/>
      <rect width="2.34" height="11.36" fill="#b73f44"/>
      <rect width="11.36" height="2.34" fill="#b73f44"/>
    </pattern>
  </defs>

  <!-- белое поле карты, скругление как у лиц набора -->
  <rect x="0" y="0" width="167.0869141" height="242.6669922"
        rx="5.68" ry="5.68" fill="#ffffff"/>

  <!-- бордовое поле с диагональной сеткой -->
  <rect x="4.34" y="4.34" width="158.4069141" height="233.9869922"
        rx="3.01" ry="3.01" fill="url(#lattice)"/>

  <!-- тонкая светлая рамка внутри поля -->
  <rect x="6.35" y="6.35" width="154.3869141" height="229.9669922"
        rx="2.34" ry="2.34"
        fill="none" stroke="#f0d6d8" stroke-width="0.67"/>
</svg>
