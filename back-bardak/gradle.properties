# Прямая ссылка на JDK 21: системный JAVA_HOME указывает на Java 8, а менять его глобально
# не хочется. Так `./gradlew` работает без обёрток и переменных окружения.
org.gradle.java.home=/Users/shabdanbek.m/Library/Java/JavaVirtualMachines/corretto-21.0.7/Contents/Home

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
