# Прямая ссылка на JDK 21: системный JAVA_HOME указывает на Java 8, а менять его глобально
# не хочется. Так `./gradlew` работает без обёрток и переменных окружения.
org.gradle.java.home=/Users/shabdanbek.m/Library/Java/JavaVirtualMachines/corretto-21.0.7/Contents/Home

org.gradle.parallel=true
org.gradle.caching=true
# Загрузка зависимостей ломалась на PKIX: TLS в этой сети перехватывается, и корневой
# сертификат лежит в связке ключей macOS, а не в cacerts JDK. curl работает, Gradle — нет.
# KeychainStore отправляет Java за доверием туда же, куда ходит система.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Djavax.net.ssl.trustStoreType=KeychainStore
