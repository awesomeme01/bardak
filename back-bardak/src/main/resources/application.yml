spring:
  application:
    name: back-bardak

  datasource:
    url: jdbc:postgresql://localhost:5432/bardak
    username: bardak
    password: bardak
    hikari:
      pool-name: bardak-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Схемой управляет Flyway. ddl-auto никогда не должен её менять.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

  # Собранный фронт (npm run build). Для разработки удобнее Vite на 5173 —
  # он проксирует /api и /ws сюда, а этот путь нужен, чтобы поднять всё одним процессом.
  web:
    resources:
      static-locations: file:${bardak.frontend.path}
      cache:
        period: 0

server:
  # 8080 на машине разработчика занят Docker Desktop — берём 8088.
  port: ${BARDAK_PORT:8088}
  shutdown: graceful

bardak:
  frontend:
    path: ../front-bardak/dist/
  assets:
    # Наборы карт и темы стола. Отдаются как /assets/card-sets/<набор>/<карта>.png
    path: ./assets/
    cache-seconds: 0     # в проде — надолго: имена карт стабильны, версия набора в манифесте
  ws:
    # 5173 — будущий dev-сервер Vite, когда обновится Node.
    allowed-origins: http://localhost:8088,http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    kz.bardak: DEBUG
