spring:
  application:
    name: back-bardak

  datasource:
    url: jdbc:postgresql://localhost:5432/bardak
    username: bardak
    password: bardak
    hikari:
      pool-name: bardak-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Схемой управляет Flyway. ddl-auto никогда не должен её менять.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

  # Собранный фронт (npm run build). Для разработки удобнее Vite на 5173 —
  # он проксирует /api и /ws сюда, а этот путь нужен, чтобы поднять всё одним процессом.
  web:
    resources:
      static-locations: file:${bardak.frontend.path}
      cache:
        period: 0

server:
  # 8080 на машине разработчика занят Docker Desktop — берём 8088.
  port: ${BARDAK_PORT:8088}
  shutdown: graceful

bardak:
  auth:
    # HMAC-ключ подписи access-токенов. В проде обязателен через окружение:
    # дефолт годится только для локальной разработки и в git попадает осознанно.
    jwt-secret: ${BARDAK_JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum!!}
    # Короткий access — главная защита при утечке: украденный токен живёт минуты.
    access-ttl: 15m
    refresh-ttl: 30d
    # Тикет живёт ровно столько, чтобы клиент успел открыть сокет (ADR-005).
    ws-ticket-ttl: 30s
    # Регистрация закрытая: игра для узкого круга, а эндпоинт торчит наружу.
    invite-codes: ${BARDAK_INVITE_CODES:bardak-2026}

  game:
    # Времена стола из §5.1–5.2 правил. Таймер хода при отключении игрока
    # останавливается, а не перезапускается.
    turn-timeout: 30s
    disconnect-grace: 60s

  rating:
    # Сезон закрывается вручную (ADR-037), и делать это вправе не каждый. Ролей в системе
    # нет: список логинов дешевле роли, пока административное действие ровно одно.
    season-admins: ${BARDAK_SEASON_ADMINS:}

  frontend:
    path: ../front-bardak/dist/
  assets:
    # Наборы карт и темы стола. Отдаются как /assets/card-sets/<набор>/<карта>.png
    path: ./assets/
    cache-seconds: 0     # в проде — надолго: имена карт стабильны, версия набора в манифесте
  ws:
    # 5173 — будущий dev-сервер Vite, когда обновится Node.
    allowed-origins: http://localhost:8088,http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    kz.bardak: DEBUG
