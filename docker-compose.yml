services:
  postgres:
    image: postgres:16-alpine
    container_name: bardak-postgres
    environment:
      POSTGRES_DB: bardak
      POSTGRES_USER: bardak
      POSTGRES_PASSWORD: bardak
      # Явная локаль: сортировка влияет на индексы, и менять её потом больно.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - bardak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bardak -d bardak"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bardak-pgdata:
